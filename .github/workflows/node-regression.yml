name: Node regression tests

on:
  push:
    branches:
      - main
      - fix/redteam-semantic-identity
      - fix/debt-015-profile-governs
      - integration/taller-pod-consolidation
      - fix/redteam-production-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check js/motor-nucleo.js
          for file in js/*.js shared/*.js secular-engine/*.js tests/*.test.js; do
            node --check "$file"
          done
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser security regression
        run: node tests/security-browser.test.js
      - name: Run regression suite
        run: |
          set -e
          echo "=== RT-02 focused: Gospel ES prompt ==="
          node tests/test_gospel_es_prompt_fix.js
          echo "=== RT-01 focused: semantic identity ==="
          node tests/semantic-identity.test.js
          echo "=== secular-prompt-contract ==="
          node tests/secular-prompt-contract.test.js
          for file in tests/*.test.js; do
            echo "=== $file ==="
            node "$file"
          done

  rt02-focused:
    name: RT-02 focused regressions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Gospel ES prompt regression
        run: node tests/test_gospel_es_prompt_fix.js
      - name: Run semantic identity regression
        run: node tests/semantic-identity.test.js
