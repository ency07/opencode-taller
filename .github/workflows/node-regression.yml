name: Node regression tests

on:
  push:
    branches:
      - main
      - fix/redteam-semantic-identity
      - fix/debt-015-profile-governs
      - integration/taller-pod-consolidation
      - fix/redteam-production-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check js/motor-nucleo.js
          for file in js/*.js shared/*.js secular-engine/*.js tests/*.test.js; do
            node --check "$file"
          done
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser security regression
        run: node tests/security-browser.test.js
      - name: Run regression suite
        run: |
          set -e
          echo "=== RT-02 focused: Gospel ES prompt ==="
          node tests/test_gospel_es_prompt_fix.js
          echo "=== RT-01 focused: semantic identity ==="
          node tests/semantic-identity.test.js
          echo "=== secular-prompt-contract ==="
          node tests/secular-prompt-contract.test.js
          for file in tests/*.test.js; do
            echo "=== $file ==="
            node "$file"
          done

  rt02-focused:
    name: RT-02 focused regressions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Gospel ES prompt regression
        run: node tests/test_gospel_es_prompt_fix.js
      - name: Run semantic identity regression
        run: node tests/semantic-identity.test.js

  rt03-audience:
    name: RT-03 audience regressions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run audience and product contracts
        run: node tests/audience-product-contracts.test.js
      - name: Run audience auto-selection regressions
        run: node tests/audiencias-auto.test.js
      - name: Run regional audience isolation regressions
        run: node tests/region-estilos-audiencias.test.js

  rt04-product-fit:
    name: RT-04 product fit diagnostics
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run product fit and layout regressions
        run: |
          node tests/product-fit-soft-tee.test.js
          node tests/umbral-qc.test.js
          node tests/layout-selector.test.js
          node tests/layout-arq-compat.test.js

  rt05-validation-state:
    name: RT-05 validation state
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check motor syntax
        run: node --check js/motor-nucleo.js
      - name: Run validation and visual QA regressions
        run: node tests/validar-qa.test.js

  rt06-approved-directions-tombstones:
    name: RT-06 approved directions tombstones
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run approved directions tombstone regression
        run: node tests/approved-directions-sync-tombstone.test.js
