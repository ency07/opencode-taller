name: Node regression tests

on:
  push:
    branches:
      - main
      - fix/redteam-semantic-identity
      - fix/debt-015-profile-governs
      - integration/taller-pod-consolidation
      - fix/redteam-production-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check js/motor-nucleo.js
          for file in js/*.js shared/*.js secular-engine/*.js tests/*.test.js; do
            node --check "$file"
          done
      - name: Run regression suite
        run: |
          set -e
          echo "=== secular-prompt-contract ==="
          node tests/secular-prompt-contract.test.js
          for file in tests/*.test.js; do
            echo "=== $file ==="
            node "$file"
          done
          echo "=== tests/test_gospel_es_prompt_fix.js ==="
          node tests/test_gospel_es_prompt_fix.js
